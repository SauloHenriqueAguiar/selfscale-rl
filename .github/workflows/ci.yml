name: CI

on:
  push:
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64.8
      - run: go test -race -coverpkg=./manager/...,./simulator/... ./...

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
      - run: terraform fmt -check -recursive infra
      - run: terraform -chdir=infra/terraform/cluster init -backend=false && terraform -chdir=infra/terraform/cluster validate
      - run: terraform -chdir=infra/terraform/platform init -backend=false && terraform -chdir=infra/terraform/platform validate

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pandas scipy matplotlib pytest
      - run: python -m pytest -q
